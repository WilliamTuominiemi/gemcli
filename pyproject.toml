[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-cli"
version = "0.1.0"
description = "Gemini CLI tool"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "python-dotenv",
]

[project.scripts]
gemcli = "main:main"

[tool.setuptools]
py-modules = ["main", "declarations"]

